name: Build Debug APK

on:
  push:
    branches:
      - main
      - 'trae/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK components
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using ANDROID_HOME=$ANDROID_HOME"
          # 接受所有 SDK 许可
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" >/dev/null
          echo "Android SDK components installed."

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Validate gradle-wrapper.jar
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "❌ gradle-wrapper.jar missing"
            exit 1
          fi
          SIZE=$(stat -c%s gradle/wrapper/gradle-wrapper.jar)
          echo "gradle-wrapper.jar size: $SIZE bytes"
          if [ "$SIZE" -lt 30000 ]; then
            echo "❌ gradle-wrapper.jar too small - likely incomplete"
            exit 1
          fi
          if ! unzip -l gradle/wrapper/gradle-wrapper.jar | grep -q "org/gradle/cli/CommandLineParser"; then
            echo "❌ gradle-wrapper.jar missing required class org/gradle/cli/CommandLineParser"
            exit 1
          fi
          echo "✅ gradle-wrapper.jar validated"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --warning-mode=all

      - name: Verify APK exists
        run: |
          ls -lh app/build/outputs/apk/debug/
          file app/build/outputs/apk/debug/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DataRecovery-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Generate build report
        if: always()
        run: |
          echo "## Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "✅ Debug APK built successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Artifact:** \`app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
            echo "**Size:** $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
            echo "**SHA256:** $(sha256sum app/build/outputs/apk/debug/app-debug.apk | cut -d' ' -f1)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download the APK from the **Artifacts** section below." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build failed - check logs above" >> $GITHUB_STEP_SUMMARY
          fi
